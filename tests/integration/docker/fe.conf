http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010
arrow_flight_sql_port = 8070
priority_networks = 172.16.127.0/24
default_replication_num = 1
# -XX:-UseContainerSupport: GitHub Actions runners expose cgroup v2 without a memory
# controller, which makes JDK 17's CgroupV2Subsystem throw NPE and crash FE startup.
JAVA_OPTS_FOR_JDK_17 = "-Dfile.encoding=UTF-8 -Xmx1024m -Xms1024m -XX:-UseContainerSupport --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED"
