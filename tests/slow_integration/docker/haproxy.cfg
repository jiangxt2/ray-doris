global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 10s
    timeout client 180s
    timeout server 180s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend doris_https_ingress
    bind :18443 ssl crt /tls/ingress.pem
    mode http
    option httplog
    default_backend doris_fe_http

backend doris_fe_http
    mode http
    server fe fe:8030 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none

frontend doris_mysql_ingress
    bind :19030
    default_backend doris_fe_mysql

backend doris_fe_mysql
    server fe fe:9030 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none

frontend doris_fe_flight_ingress
    bind :18070
    default_backend doris_fe_flight

backend doris_fe_flight
    server fe fe:8070 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none

frontend doris_flight_ingress
    bind :18050
    default_backend doris_be_flight

backend doris_be_flight
    balance roundrobin
    option tcp-check
    default-server inter 2s fall 2 rise 2 resolvers docker init-addr libc,none
    server be-1 be-1:8050 check
    server be-2 be-2:8050 check
    server be-3 be-3:8050 check

listen stats
    bind :8404
    mode http
    stats enable
    stats uri /stats
    stats show-legends
    stats show-node
