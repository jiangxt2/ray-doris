name: CI

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Immutable release candidate commit to test
        required: false
        type: string
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Python ${{ matrix.python }} / Ray ${{ matrix.ray }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            ray: "2.49.2"
          - python: "3.10"
            ray: "2.55.1"
          - python: "3.12"
            ray: "2.56.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e ".[test]" "ray[data]==${{ matrix.ray }}"
      - run: .venv/bin/python -m pytest tests/unit tests/contract --cov=ray_doris --cov-report=term-missing

  quality:
    name: Static quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev,flight]" "ray[data]==2.56.1"
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/ruff check .
      - run: .venv/bin/mypy
      - run: .venv/bin/pre-commit run --all-files
      - run: >-
          .venv/bin/python tools/check_workflow_pins.py
          .github/workflows/ci.yml
          .github/workflows/release.yml
          .github/workflows/slow-integration.yml
      - run: >-
          .venv/bin/python tools/check_release_workflow.py
          .github/workflows/ci.yml .github/workflows/release.yml

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - name: Install spelling system dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes enchant-2
      - name: Install documentation environment
        run: |
          uv venv .docs-venv --python 3.12
          uv pip install \
            --python .docs-venv/bin/python \
            --requirement doc/requirements-doc.lock.txt
          uv pip install \
            --python .docs-venv/bin/python \
            --no-build-isolation \
            --no-deps \
            --editable .
      - name: Check documentation contracts
        run: .docs-venv/bin/python tools/check_docs.py
      - name: Build strict documentation
        run: make -C doc strict SPHINXBUILD=../.docs-venv/bin/sphinx-build
      - name: Check documentation spelling
        run: make -C doc spelling SPHINXBUILD=../.docs-venv/bin/sphinx-build
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.4.1
        with:
          args: >-
            --no-progress
            --max-retries 3
            README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md doc/source

  integration:
    name: Doris 4.0.6 integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[test,flight]" "ray[data]==2.56.1"
      - run: docker compose -f tests/integration/docker-compose.yml up -d --build
      - run: .venv/bin/python -m pytest tests/integration -v
      - name: Capture Doris logs
        if: always()
        run: docker compose -f tests/integration/docker-compose.yml logs --no-color > doris-it.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: doris-it-log
          path: doris-it.log
      - name: Stop Doris
        if: always()
        run: docker compose -f tests/integration/docker-compose.yml down -v --rmi local

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - run: uv venv --python 3.12
      - run: uv pip install build twine
      - run: .venv/bin/python -m build
      - run: .venv/bin/twine check dist/*
      - run: uv venv --python 3.12 .venv-package
      - run: uv pip install --python .venv-package/bin/python dist/*.whl
      - run: .venv-package/bin/python -c "import ray_doris; print(ray_doris.__version__)"
      - run: uv venv --python 3.12 .venv-sdist
      - run: uv pip install --python .venv-sdist/bin/python dist/*.tar.gz
      - run: .venv-sdist/bin/python -c "import ray_doris; print(ray_doris.__version__)"
