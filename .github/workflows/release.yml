name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full master-reachable commit SHA to validate without publishing
        required: true
        type: string
      expected_version:
        description: Exact package version expected at the candidate commit
        required: true
        type: string
      release_profile:
        description: Release evidence profile; Alpha permits deferred distributed evidence
        required: false
        default: alpha
        type: choice
        options:
          - alpha
          - enterprise
      formal_publish:
        description: Publish using an existing immutable release tag after recovery approval
        required: false
        default: false
        type: boolean
      release_tag:
        description: Existing immutable release tag for formal recovery, for example v1.0
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref || inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.candidate.outputs.mode }}
      sha: ${{ steps.candidate.outputs.sha }}
      version: ${{ steps.candidate.outputs.version }}
      tag: ${{ steps.candidate.outputs.tag }}
      master_sha: ${{ steps.candidate.outputs.master_sha }}
      release_profile: ${{ steps.candidate.outputs.release_profile }}
      slow_required: ${{ steps.candidate.outputs.slow_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: master
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch protected master and tag identities
        run: >-
          git fetch --force origin
          +refs/heads/master:refs/remotes/origin/master
          +refs/tags/*:refs/tags/*
      - name: Resolve immutable candidate
        id: candidate
        env:
          CANDIDATE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.ref }}
          EXPECTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_version || '' }}
          MODE: ${{ github.event_name == 'push' && 'tag' || inputs.formal_publish == true && 'tag' || 'dry-run' }}
          RELEASE_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_profile || 'alpha' }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.formal_publish == true && inputs.release_tag || '' }}
          EVENT_SHA: ${{ github.event_name == 'push' && github.event.after || inputs.formal_publish == true && inputs.candidate_sha || '' }}
          EVENT_CREATED: ${{ github.event_name == 'push' || inputs.formal_publish == true }}
          EVENT_DELETED: ${{ github.event_name == 'push' && github.event.deleted || false }}
          EVENT_FORCED: ${{ github.event_name == 'push' && github.event.forced || false }}
        run: >-
          python tools/check_release.py
          --mode "${MODE}"
          --release-profile "${RELEASE_PROFILE}"
          --candidate-ref "${CANDIDATE_REF}"
          --expected-version "${EXPECTED_VERSION}"
          --tag "${RELEASE_TAG}"
          --master-ref origin/master
          --event-sha "${EVENT_SHA}"
          --event-created "${EVENT_CREATED}"
          --event-deleted "${EVENT_DELETED}"
          --event-forced "${EVENT_FORCED}"
          --github-output "${GITHUB_OUTPUT}"

  verify:
    name: Candidate CI gates
    needs: candidate
    uses: ./.github/workflows/ci.yml
    with:
      candidate_sha: ${{ needs.candidate.outputs.sha }}

  slow-evidence:
    name: Verify exact-SHA slow evidence
    needs: [candidate, verify]
    if: >-
      always() &&
      needs.candidate.result == 'success' &&
      needs.verify.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      run_id: ${{ steps.slow_run.outputs.run-id }}
      historical_recovery: ${{ steps.slow_mode.outputs.historical_recovery }}
      slow_required: ${{ steps.slow_mode.outputs.slow_required }}
    steps:
      - name: Determine evidence mode
        id: slow_mode
        env:
          FORMAL_HISTORICAL_RECOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.formal_publish == true && inputs.release_tag == 'v1.0' && needs.candidate.outputs.version == '1.0' }}
          RELEASE_PROFILE: ${{ needs.candidate.outputs.release_profile }}
        run: |
          echo "historical_recovery=${FORMAL_HISTORICAL_RECOVERY}" >> "$GITHUB_OUTPUT"
          if [ "${FORMAL_HISTORICAL_RECOVERY}" = "true" ]; then
            echo "slow_required=false" >> "$GITHUB_OUTPUT"
          elif [ "${RELEASE_PROFILE}" = "enterprise" ]; then
            echo "slow_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "slow_required=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.slow_mode.outputs.historical_recovery != 'true' && steps.slow_mode.outputs.slow_required == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.slow_mode.outputs.historical_recovery != 'true' && steps.slow_mode.outputs.slow_required == 'true'
        with:
          python-version: "3.12"
      - name: Find unique exact-SHA slow result
        id: slow_run
        if: steps.slow_mode.outputs.historical_recovery != 'true' && steps.slow_mode.outputs.slow_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: >-
          python tools/find_slow_evidence.py
          --candidate-sha "$CANDIDATE_SHA"
          --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.slow_mode.outputs.historical_recovery != 'true' && steps.slow_mode.outputs.slow_required == 'true'
        with:
          artifact-ids: ${{ steps.slow_run.outputs.artifact-id }}
          path: slow-result
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.slow_run.outputs.run-id }}
      - name: Verify slow result identity
        if: steps.slow_mode.outputs.historical_recovery != 'true' && steps.slow_mode.outputs.slow_required == 'true'
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          SLOW_RUN_ID: ${{ steps.slow_run.outputs.run-id }}
        run: >-
          python tools/check_slow_result.py
          slow-result/slow-result.json
          --expected-commit "$CANDIDATE_SHA"
          --expected-run-id "$SLOW_RUN_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        if: steps.slow_mode.outputs.historical_recovery != 'true' && steps.slow_mode.outputs.slow_required == 'true'
        with:
          name: release-slow-evidence-${{ needs.candidate.outputs.sha }}
          path: slow-result/slow-result.json
          if-no-files-found: error

  build:
    name: Build and verify distributions
    needs: [candidate, verify, slow-evidence]
    runs-on: ubuntu-latest
    outputs:
      distributions_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.slow-evidence.outputs.slow_required == 'true'
        with:
          artifact-ids: ${{ needs.slow-evidence.outputs.artifact_id }}
          path: slow-evidence
          merge-multiple: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv venv --python 3.12
      - run: uv pip install --python .venv/bin/python "build==1.3.0" "twine==6.2.0"
      - name: Re-verify downloaded slow evidence
        if: needs.slow-evidence.outputs.slow_required == 'true'
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          SLOW_RUN_ID: ${{ needs.slow-evidence.outputs.run_id }}
        run: >-
          .venv/bin/python tools/check_slow_result.py
          slow-evidence/slow-result.json
          --expected-commit "$CANDIDATE_SHA"
          --expected-run-id "$SLOW_RUN_ID"
      - run: .venv/bin/python -m build --outdir release-artifacts/packages
      - run: .venv/bin/twine check release-artifacts/packages/*
      - run: >-
          .venv/bin/python tools/verify_release_artifacts.py release-artifacts/packages
          --name ray-doris
          --version "${{ needs.candidate.outputs.version }}"
          --manifest release-artifacts/SHA256SUMS
          --prepare
      - name: Upload immutable distributions
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: release-artifacts/
          if-no-files-found: error

  install-smoke:
    name: Install ${{ matrix.distribution }} ${{ matrix.profile }}
    needs: [candidate, verify, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: base
            extra: ""
            distribution: wheel
          - profile: flight
            extra: "[flight]"
            distribution: wheel
          - profile: base
            extra: ""
            distribution: sdist
          - profile: flight
            extra: "[flight]"
            distribution: sdist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_artifact_id }}
          path: release/
          merge-multiple: true
      - run: >-
          python tools/verify_release_artifacts.py release/packages
          --name ray-doris
          --version "${{ needs.candidate.outputs.version }}"
          --manifest release/SHA256SUMS
      - name: Install built distribution
        env:
          EXTRA: ${{ matrix.extra }}
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          if [ "$DISTRIBUTION" = "wheel" ]; then
            package="$(find release/packages -maxdepth 1 -type f -name '*.whl')"
          else
            package="$(find release/packages -maxdepth 1 -type f -name '*.tar.gz')"
          fi
          test -n "$package"
          python -m pip install "ray-doris${EXTRA} @ file://${GITHUB_WORKSPACE}/${package}"
      - run: python -c "import ray_doris; print(ray_doris.__version__)"

  testpypi-publish:
    name: Publish formal artifact to TestPyPI
    if: >-
      always() &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.formal_publish == true && github.ref == 'refs/heads/master')
      ) &&
      needs.candidate.result == 'success' &&
      needs.verify.result == 'success' &&
      needs.slow-evidence.result == 'success' &&
      needs.build.result == 'success' &&
      needs.install-smoke.result == 'success' &&
      needs.candidate.outputs.mode == 'tag'
    needs: [candidate, verify, slow-evidence, build, install-smoke]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_artifact_id }}
          path: release/
          merge-multiple: true
      - run: >-
          python tools/verify_release_tag.py
          --tag "${{ needs.candidate.outputs.tag }}"
          --expected-sha "${{ needs.candidate.outputs.sha }}"
      - run: >-
          python tools/verify_release_artifacts.py release/packages
          --name ray-doris
          --version "${{ needs.candidate.outputs.version }}"
          --manifest release/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/packages/
          repository-url: https://test.pypi.org/legacy/

  testpypi-smoke:
    name: TestPyPI smoke (${{ matrix.profile }})
    if: >-
      always() &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.formal_publish == true && github.ref == 'refs/heads/master')
      ) &&
      needs.candidate.result == 'success' &&
      needs.slow-evidence.result == 'success' &&
      needs.testpypi-publish.result == 'success' &&
      needs.candidate.outputs.mode == 'tag'
    needs: [candidate, slow-evidence, testpypi-publish]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: base
            extra: ""
          - profile: flight
            extra: "[flight]"
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install from TestPyPI with PyPI dependency fallback
        env:
          EXTRA: ${{ matrix.extra }}
          VERSION: ${{ needs.candidate.outputs.version }}
        run: >-
          python -m pip install
          --index-url https://test.pypi.org/simple/
          --extra-index-url https://pypi.org/simple/
          "ray-doris${EXTRA}==${VERSION}"
      - run: python -c "import ray_doris; print(ray_doris.__version__)"

  publish:
    name: Publish to PyPI
    if: >-
      always() &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.formal_publish == true && github.ref == 'refs/heads/master')
      ) &&
      needs.candidate.result == 'success' &&
      needs.verify.result == 'success' &&
      needs.slow-evidence.result == 'success' &&
      needs.build.result == 'success' &&
      needs.install-smoke.result == 'success' &&
      needs.testpypi-publish.result == 'success' &&
      needs.testpypi-smoke.result == 'success' &&
      needs.candidate.outputs.mode == 'tag'
    needs: [candidate, verify, slow-evidence, build, install-smoke, testpypi-publish, testpypi-smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_artifact_id }}
          path: release/
          merge-multiple: true
      - run: >-
          python tools/verify_release_tag.py
          --tag "${{ needs.candidate.outputs.tag }}"
          --expected-sha "${{ needs.candidate.outputs.sha }}"
      - run: >-
          python tools/verify_release_artifacts.py release/packages
          --name ray-doris
          --version "${{ needs.candidate.outputs.version }}"
          --manifest release/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/packages/

  github-release:
    name: Create GitHub Release
    if: >-
      always() &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.formal_publish == true && github.ref == 'refs/heads/master')
      ) &&
      needs.candidate.result == 'success' &&
      needs.verify.result == 'success' &&
      needs.slow-evidence.result == 'success' &&
      needs.build.result == 'success' &&
      needs.install-smoke.result == 'success' &&
      needs.testpypi-publish.result == 'success' &&
      needs.testpypi-smoke.result == 'success' &&
      needs.publish.result == 'success' &&
      needs.candidate.outputs.mode == 'tag'
    needs: [candidate, verify, slow-evidence, build, install-smoke, testpypi-publish, testpypi-smoke, publish]
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_artifact_id }}
          path: release/
          merge-multiple: true
      - run: >-
          python tools/verify_release_tag.py
          --tag "${{ needs.candidate.outputs.tag }}"
          --expected-sha "${{ needs.candidate.outputs.sha }}"
      - run: >-
          python tools/verify_release_artifacts.py release/packages
          --name ray-doris
          --version "${{ needs.candidate.outputs.version }}"
          --manifest release/SHA256SUMS
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ needs.candidate.outputs.tag }}"
          release/packages/* release/SHA256SUMS
          --title "ray-doris ${{ needs.candidate.outputs.version }}"
          --notes-file "release-notes/v${{ needs.candidate.outputs.version }}.md"
