[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ray-doris"
version = "0.1.0a1"
description = "Community-maintained Apache Doris datasource for Ray Data"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "jiangxt2" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "PyMySQL>=1.1.1,<2",
  "ray[data]>=2.49.2,<2.57",
]

[project.optional-dependencies]
flight = ["adbc-driver-flightsql>=1.11.0,<2; python_version >= '3.10'"]
test = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-timeout>=2.3",
]
dev = [
  "build>=1.2.2",
  "mypy>=1.17,<1.18",
  "pre-commit>=4.2",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-timeout>=2.3",
  "pyarrow-stubs>=20",
  "ruff>=0.12.8",
  "twine>=6.1",
  "types-PyMySQL>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/jiangxt2/ray-doris"
Issues = "https://github.com/jiangxt2/ray-doris/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ray_doris"]

[tool.hatch.build.targets.sdist]
exclude = ["/AGENTS.md"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests/unit", "tests/integration"]
timeout = 300
markers = [
  "integration: requires a real Apache Doris deployment",
  "slow_integration: requires the opt-in multi-node Ray and Doris Compose cluster",
]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ray_doris"]
