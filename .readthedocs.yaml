version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - enchant-2
  jobs:
    install:
      - pip install --requirement doc/requirements-doc.lock.txt
      - pip install --no-build-isolation --no-deps --editable .
    build:
      html:
        # This custom command replaces the default RTD Sphinx build. The
        # Makefile enforces warnings-as-errors with -W and --keep-going.
        - >-
          make -C doc html
          SPHINXBUILD=sphinx-build
          HTMLDIR="$READTHEDOCS_OUTPUT/html"

sphinx:
  configuration: doc/source/conf.py
