repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        exclude: ^tests/native_integration/docker-compose\.yml$
      - id: check-yaml
        name: check compose yaml
        # Compose uses !reset to remove inherited build definitions.
        files: ^tests/native_integration/docker-compose\.yml$
        args: [--unsafe]
      - id: end-of-file-fixer
      - id: trailing-whitespace
